spring.application.name=resqnet-backend
server.port=8080

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/resqnet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------- JWT ----------
resqnet.jwt.secret=ResQNetSuperSecretKeyForJWTSigning1234567890ChangeInProd
resqnet.jwt.expiration-ms=86400000

# ---------- CORS ----------
resqnet.cors.allowed-origins=http://localhost:3000

# ---------- Logging ----------
logging.level.com.resqnet=INFO
